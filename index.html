<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiry Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8, #dce3ed);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #1a2639, #2b3b5c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .menu-card {
            background: rgba(255,255,255,0.6);
            border-radius: 24px;
            padding: 18px 20px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.7);
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .menu-card:active {
            transform: scale(0.97);
        }
        .menu-icon {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .menu-icon.add {
            background: #d1e0ff;
            color: #1f3a7a;
        }
        .menu-icon.check {
            background: #d4f0e0;
            color: #0f4a3a;
        }
        .menu-icon.list {
            background: #fae2d0;
            color: #7a4a2a;
        }
        .menu-icon.export {
            background: #f0d4f0;
            color: #6a2a6a;
        }
        .menu-icon.sync {
            background: #d4e0f0;
            color: #1a4a7a;
        }
        .menu-text {
            flex: 1;
        }
        .menu-text h3 {
            font-size: 18px;
            color: #131d33;
        }
        .menu-text p {
            font-size: 13px;
            color: #5a6a8a;
        }
        .arrow {
            color: #7a8aaa;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.4);
            padding: 12px 16px;
            border-radius: 20px;
            margin-top: 16px;
            font-size: 14px;
            color: #1a2639;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats .count {
            background: #1f2b44;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 600;
        }
        .stats .expiring-badge {
            background: #fff3cd;
            color: #856404;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #7a8aaa;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,30,50,0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 15px;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            transition: opacity 0.4s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.success {
            border-color: #2a7a4a;
        }
        .toast.error {
            border-color: #b33a3a;
        }
        @media (max-width: 400px) {
            .container { padding: 16px; }
            .menu-card { padding: 14px 16px; gap: 12px; }
            .menu-icon { width: 44px; height: 44px; font-size: 20px; }
            .menu-text h3 { font-size: 16px; }
            .menu-text p { font-size: 12px; }
            .stats { font-size: 13px; padding: 10px 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-box-open"></i> Expiry</h1>
            <div style="font-size: 20px; color: #1f2b44;">
                <i class="fas fa-calendar-alt"></i>
            </div>
        </div>

        <!-- ===== ADD PRODUK ===== -->
        <a href="exp.html" class="menu-card">
            <div class="menu-icon add"><i class="fas fa-plus-circle"></i></div>
            <div class="menu-text">
                <h3>Add Produk Exp</h3>
                <p><i class="fas fa-barcode"></i> Scan EAN, Qty, Exp</p>
            </div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </a>

        <!-- ===== CHECKER ===== -->
        <div class="menu-card" onclick="checkExpired()">
            <div class="menu-icon check"><i class="fas fa-search"></i></div>
            <div class="menu-text">
                <h3>Checker</h3>
                <p><i class="fas fa-clipboard"></i> Cek produk kadaluarsa</p>
            </div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </div>

        <!-- ===== MASTER LIST → href ke master.html ===== -->
        <a href="master.html" class="menu-card">
            <div class="menu-icon list"><i class="fas fa-archive"></i></div>
            <div class="menu-text">
                <h3>Master List Exp</h3>
                <p><i class="fas fa-table"></i> Lihat semua produk</p>
            </div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </a>

        <!-- ===== SYNC MASTER DATA DARI GITHUB ===== -->
        <div class="menu-card" onclick="syncFromGitHub()">
            <div class="menu-icon sync"><i class="fas fa-cloud-download-alt"></i></div>
            <div class="menu-text">
                <h3>Sync Master Data</h3>
                <p><i class="fas fa-sync"></i> Ambil dari GitHub</p>
            </div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </div>

        <!-- ===== EXPORT EXCEL ===== -->
        <div class="menu-card" onclick="exportToExcel()">
            <div class="menu-icon export"><i class="fas fa-file-excel"></i></div>
            <div class="menu-text">
                <h3>Export ke Excel</h3>
                <p><i class="fas fa-download"></i> Download file .xlsx</p>
            </div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats">
            <span><i class="fas fa-hourglass-half"></i> <span id="expiringCount">0</span> akan kadaluarsa</span>
            <span class="count" id="totalCount">0</span>
        </div>

        <div class="footer">
            <i class="fas fa-database"></i> Data tersimpan di browser
            <span style="margin: 0 8px;">|</span>
            <span id="lastSyncInfo"><i class="far fa-clock"></i> Belum sync</span>
        </div>
    </div>

    <!-- ===== LIBRARY ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        // ============================================================
        //  DATA
        // ============================================================
        function getProducts() {
            return JSON.parse(localStorage.getItem('products')) || [];
        }

        function saveProducts(products) {
            localStorage.setItem('products', JSON.stringify(products));
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            const products = getProducts();
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const expiring = products.filter(p => {
                const exp = new Date(p.exp);
                exp.setHours(0, 0, 0, 0);
                const diff = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
                return diff >= 0 && diff <= 7;
            });
            
            document.getElementById('totalCount').textContent = products.length;
            document.getElementById('expiringCount').textContent = expiring.length;
            
            // Update last sync info
            const lastSync = localStorage.getItem('lastSync');
            if (lastSync) {
                document.getElementById('lastSyncInfo').innerHTML = 
                    `<i class="fas fa-check-circle" style="color:#2a7a4a;"></i> Sync ${new Date(parseInt(lastSync)).toLocaleString('id-ID')}`;
            } else {
                document.getElementById('lastSyncInfo').innerHTML = 
                    `<i class="far fa-clock"></i> Belum sync`;
            }
        }

        // ============================================================
        //  CHECKER
        // ============================================================
        function checkExpired() {
            const products = getProducts();
            if (products.length === 0) {
                showToast('📋 Belum ada produk', 'info');
                return;
            }
            
            const expired = products.filter(p => new Date(p.exp) < new Date());
            if (expired.length === 0) {
                showToast('✅ Semua produk masih segar!', 'success');
            } else {
                const list = expired.map(p => `• ${p.name} (${p.exp})`).join('\n');
                alert(`⚠️ ${expired.length} produk kadaluarsa:\n\n${list}`);
            }
        }

        // ============================================================
        //  EXPORT EXCEL
        // ============================================================
        function exportToExcel() {
            const products = getProducts();
            if (products.length === 0) {
                showToast('⚠️ Belum ada data untuk di-export!', 'error');
                return;
            }

            const data = products.map((p, i) => ({
                'No': i + 1,
                'Nama Produk': p.name || '-',
                'EAN': p.ean || '-',
                'Qty': p.qty || 0,
                'Tanggal Exp': p.exp || '-',
                'Status': new Date(p.exp) < new Date() ? 'Expired' : 'Active'
            }));

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Products');

            const fileName = `products_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(wb, fileName);
            
            showToast(`✅ File "${fileName}" berhasil di-download!`, 'success');
        }

        // ============================================================
        //  SYNC MASTER DATA DARI GITHUB
        // ============================================================
        async function syncFromGitHub() {
            showToast('⏳ Mengambil data master dari GitHub...', 'info');
            
            try {
                const url = 'https://raw.githubusercontent.com/alexpim2/projectMT/main/masterlist.xlsx';
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                if (!jsonData || jsonData.length === 0) {
                    showToast('⚠️ File kosong atau tidak valid', 'error');
                    return;
                }
                
                // Mapping data
                const products = jsonData.map(row => {
                    // Cari kolom yang sesuai
                    const ean = String(row['EAN'] || row['ean'] || row['Barcode'] || row['barcode'] || '');
                    const name = String(row['Nama Produk'] || row['nama'] || row['Product Name'] || row['Nama'] || row['name'] || '');
                    const qty = parseInt(row['Qty'] || row['qty'] || row['Quantity'] || row['quantity'] || 0);
                    const exp = formatDate(row['Tanggal Exp'] || row['exp'] || row['Tanggal Kadaluarsa'] || row['Exp'] || '');
                    
                    return { ean, name, qty, exp };
                }).filter(p => p.ean && p.name);
                
                if (products.length === 0) {
                    showToast('⚠️ Tidak ada data valid di masterlist', 'error');
                    return;
                }
                
                // Merge dengan data lokal
                let localProducts = getProducts();
                let merged = [...localProducts];
                let added = 0, updated = 0;
                
                products.forEach(master => {
                    const existingIndex = merged.findIndex(p => p.ean === master.ean);
                    if (existingIndex >= 0) {
                        // Update data master (pertahankan qty lokal jika ada)
                        if (!merged[existingIndex].qty || merged[existingIndex].qty === 0) {
                            merged[existingIndex].qty = master.qty;
                        }
                        merged[existingIndex].name = master.name;
                        merged[existingIndex].exp = master.exp;
                        updated++;
                    } else {
                        merged.push(master);
                        added++;
                    }
                });
                
                saveProducts(merged);
                localStorage.setItem('lastSync', Date.now().toString());
                updateStats();
                
                showToast(`✅ Sync berhasil! ${added} baru, ${updated} update`, 'success');
                
            } catch (error) {
                console.error('Sync error:', error);
                showToast(`❌ Gagal sync: ${error.message}`, 'error');
            }
        }

        // ============================================================
        //  FORMAT TANGGAL
        // ============================================================
        function formatDate(dateStr) {
            if (!dateStr) return '';
            
            // Coba parse berbagai format
            let date = new Date(dateStr);
            if (!isNaN(date.getTime())) {
                return date.toISOString().split('T')[0];
            }
            
            // Coba format dd/mm/yyyy atau mm/dd/yyyy
            const parts = String(dateStr).split(/[\/\-.]/);
            if (parts.length === 3) {
                // Coba dd/mm/yyyy
                let d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
                
                // Coba mm/dd/yyyy
                d = new Date(`${parts[2]}-${parts[0]}-${parts[1]}`);
                if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
            }
            
            return '';
        }

        // ============================================================
        //  TOAST NOTIFICATION
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // ============================================================
        //  INIT
        // ============================================================
        updateStats();

        // Auto update stats setiap 10 detik
        setInterval(updateStats, 10000);
    </script>
</body>
</html>
