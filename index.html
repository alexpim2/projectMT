<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Scan & Checker</title>
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f7f9fc 0%, #eef2f7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      margin: 0;
    }

    /* kartu utama – seperti glassmorphism modern */
    .landing-card {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 32px 24px 40px;
      box-shadow: 0 30px 50px rgba(0, 20, 30, 0.12), 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #0b1e33, #1b3b5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header i {
      font-size: 28px;
      color: #1b3b5c;
      background: rgba(27, 59, 92, 0.08);
      padding: 10px;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }

    /* subtitle */
    .subtitle {
      font-size: 15px;
      font-weight: 500;
      color: #4a5f73;
      margin-bottom: 28px;
      letter-spacing: -0.2px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtitle i {
      color: #2f6b8a;
      font-size: 14px;
    }

    /* grid menu dua tombol besar */
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 20px 24px;
      border-radius: 36px;
      box-shadow: 0 8px 18px rgba(0, 20, 30, 0.06), 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      border: 1px solid rgba(255, 255, 255, 0.7);
      text-decoration: none;
      color: #1a2e44;
      cursor: pointer;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .menu-item:active {
      transform: scale(0.97);
      background: white;
      box-shadow: 0 4px 10px rgba(0, 20, 30, 0.08);
    }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .menu-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #eef5fa, #dee9f2);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #1b3b5c;
      transition: 0.2s;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 4px 8px rgba(0,0,0,0.02);
    }

    .menu-item:nth-child(1) .menu-icon {
      background: linear-gradient(135deg, #d4e3f5, #bdd6ec);
      color: #0f2b44;
    }

    .menu-item:nth-child(2) .menu-icon {
      background: linear-gradient(135deg, #f0e9fa, #e2d6f5);
      color: #3a2b5e;
    }

    .menu-text {
      display: flex;
      flex-direction: column;
    }

    .menu-text .title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #0b1e33;
    }

    .menu-text .desc {
      font-size: 13px;
      font-weight: 500;
      color: #5e738a;
      opacity: 0.85;
      margin-top: 3px;
      letter-spacing: -0.1px;
    }

    .menu-arrow {
      color: #889fb3;
      font-size: 20px;
      opacity: 0.6;
      transition: 0.2s;
    }

    .menu-item:hover .menu-arrow {
      opacity: 1;
      transform: translateX(4px);
      color: #1b3b5c;
    }

    /* footer / badge */
    .footer-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      color: #596f85;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 16px 12px;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.7);
      letter-spacing: -0.2px;
    }

    .footer-note i {
      color: #3a6b8a;
      font-size: 14px;
    }

    /* efek shimmer subtle */
    .menu-item {
      position: relative;
      overflow: hidden;
    }

    .menu-item::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 80%);
      pointer-events: none;
    }

    /* link reset */
    a {
      text-decoration: none;
    }

    /* touch friendly */
    .menu-item {
      -webkit-tap-highlight-color: transparent;
    }

    /* small screens */
    @media (max-width: 420px) {
      .landing-card {
        padding: 24px 16px 32px;
        border-radius: 36px;
      }
      .menu-item {
        padding: 16px 18px;
      }
      .menu-icon {
        width: 48px;
        height: 48px;
        font-size: 24px;
      }
      .menu-text .title {
        font-size: 17px;
      }
      .menu-text .desc {
        font-size: 12px;
      }
      .header h1 {
        font-size: 21px;
      }
    }

    /* tambahan sentuhan premium */
    .badge-pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #3aa37c;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 0 2px rgba(58, 163, 124, 0.2);
    }
  </style>
</head>
<body>
  <div class="landing-card">
    <!-- header -->
    <div class="header">
      <h1><i class="fas fa-cube" style="margin-right: 8px; background: linear-gradient(135deg, #1b3b5c, #2f6b8a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>Expiry Manager</h1>
      <i class="fas fa-qrcode"></i>
    </div>

    <div class="subtitle">
      <i class="fas fa-chevron-right" style="font-size: 10px;"></i> 
      <span>pilih menu cepat</span>
    </div>

    <!-- dua menu utama -->
    <div class="menu-grid">
      <!-- SCAN & ADD BARANG -> tes.html -->
      <a href="tes.html" class="menu-item" id="scanMenu">
        <div class="menu-left">
          <div class="menu-icon">
            <i class="fas fa-camera-retro"></i>
          </div>
          <div class="menu-text">
            <span class="title">Scan & Add</span>
            <span class="desc"><i class="fas fa-barcode" style="margin-right: 4px;"></i>Barang baru</span>
          </div>
        </div>
        <div class="menu-arrow">
          <i class="fas fa-chevron-right"></i>
        </div>
      </a>

      <!-- CHECKER EXP -> checker.html -->
      <a href="check.html" class="menu-item" id="checkerMenu">
        <div class="menu-left">
          <div class="menu-icon">
            <i class="fas fa-calendar-check"></i>
          </div>
          <div class="menu-text">
            <span class="title">Checker Exp</span>
            <span class="desc"><i class="fas fa-clock" style="margin-right: 4px;"></i>cek kadaluarsa</span>
          </div>
        </div>
        <div class="menu-arrow">
          <i class="fas fa-chevron-right"></i>
        </div>
      </a>
    </div>

    <!-- footer / info tambahan -->
    <div class="footer-note">
      <span class="badge-pulse"></span>
      <i class="fas fa-shield-alt" style="margin-right: 4px;"></i> 
      <span>siap scan · 2 menu aktif</span>
      <i class="fas fa-circle" style="font-size: 6px; margin: 0 6px; opacity: 0.3;"></i>
      <i class="fas fa-phone-alt" style="opacity: 0.6;"></i>
    </div>
  </div>

  <!-- optional: tiny interaction feedback (tidak mengganggu link) -->
  <script>
    (function() {
      // hanya efek sentuhan ringan, tidak menghalangi navigasi
      const items = document.querySelectorAll('.menu-item');
      items.forEach(item => {
        item.addEventListener('touchstart', function(e) {
          // memberikan efek haptic-like (visual) 
          this.style.transition = 'transform 0.1s ease';
          this.style.transform = 'scale(0.97)';
        }, { passive: true });
        item.addEventListener('touchend', function(e) {
          this.style.transform = 'scale(1)';
        }, { passive: true });
        item.addEventListener('touchcancel', function(e) {
          this.style.transform = 'scale(1)';
        }, { passive: true });
        // untuk mouse (desktop) tetap ada efek
        item.addEventListener('mousedown', function(e) {
          this.style.transform = 'scale(0.98)';
        });
        item.addEventListener('mouseup', function(e) {
          this.style.transform = 'scale(1)';
        });
        item.addEventListener('mouseleave', function(e) {
          this.style.transform = 'scale(1)';
        });
      });
    })();
  </script>
</body>
</html>
