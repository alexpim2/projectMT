<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expiry Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #2d3748;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-badge {
            background: #edf2f7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-badge i {
            color: #48bb78;
            font-size: 8px;
        }

        /* STATS CARD - TAMPILKAN 0 */
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .stats-item {
            text-align: center;
            flex: 1;
        }

        .stats-item .number {
            font-size: 28px;
            font-weight: 700;
            display: block;
            line-height: 1.2;
        }

        .stats-item .label {
            font-size: 12px;
            opacity: 0.9;
            font-weight: 500;
            margin-top: 2px;
        }

        .stats-divider {
            width: 1px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
        }

        /* MENU CARDS */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .menu-card {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 2px solid #f0f4f8;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-card:active {
            transform: scale(0.97);
        }

        .menu-card:active::before {
            opacity: 1;
        }

        .menu-card.add:hover {
            border-color: #667eea;
        }

        .menu-card.check:hover {
            border-color: #48bb78;
        }

        .menu-card.list:hover {
            border-color: #ed8936;
        }

        .menu-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .menu-card:hover .menu-icon {
            transform: scale(1.05);
        }

        .menu-icon.add {
            background: #ebf4ff;
            color: #667eea;
        }

        .menu-card.add:hover .menu-icon {
            background: #667eea;
            color: white;
        }

        .menu-icon.check {
            background: #f0fff4;
            color: #48bb78;
        }

        .menu-card.check:hover .menu-icon {
            background: #48bb78;
            color: white;
        }

        .menu-icon.list {
            background: #fffbeb;
            color: #ed8936;
        }

        .menu-card.list:hover .menu-icon {
            background: #ed8936;
            color: white;
        }

        .menu-text {
            flex: 1;
        }

        .menu-text h3 {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 2px;
        }

        .menu-text p {
            font-size: 13px;
            color: #718096;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-text p i {
            font-size: 11px;
            opacity: 0.7;
        }

        .menu-arrow {
            color: #a0aec0;
            font-size: 14px;
            transition: all 0.3s;
        }

        .menu-card:hover .menu-arrow {
            color: #667eea;
            transform: translateX(4px);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding-top: 16px;
            border-top: 2px solid #f0f4f8;
        }

        .footer p {
            font-size: 13px;
            color: #a0aec0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .footer i {
            color: #667eea;
        }

        .footer .dot {
            width: 4px;
            height: 4px;
            background: #cbd5e0;
            border-radius: 50%;
        }

        .footer .status-online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #48bb78;
            font-weight: 500;
        }

        .footer .status-online i {
            font-size: 8px;
            color: #48bb78;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 32, 44, 0.95);
            backdrop-filter: blur(12px);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        .toast.success {
            border-color: #48bb78;
        }

        .toast.error {
            border-color: #fc8181;
        }

        .toast.info {
            border-color: #63b3ed;
        }

        /* RESPONSIVE */
        @media (max-width: 420px) {
            .container {
                padding: 20px 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header-icon {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }

            .stats-card {
                padding: 16px 20px;
            }

            .stats-item .number {
                font-size: 24px;
            }

            .menu-card {
                padding: 14px 16px;
            }

            .menu-icon {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .menu-text h3 {
                font-size: 15px;
            }

            .menu-text p {
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 16px 12px;
            }

            .stats-item .number {
                font-size: 20px;
            }

            .menu-icon {
                width: 38px;
                height: 38px;
                font-size: 16px;
                border-radius: 10px;
            }
        }

        /* DARK MODE SUPPORT */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            }

            .container {
                background: rgba(26, 32, 44, 0.95);
            }

            .header h1 {
                color: #e2e8f0;
            }

            .header-badge {
                background: #2d3748;
                color: #a0aec0;
            }

            .menu-card {
                background: #2d3748;
                border-color: #4a5568;
            }

            .menu-text h3 {
                color: #e2e8f0;
            }

            .menu-text p {
                color: #a0aec0;
            }

            .menu-arrow {
                color: #718096;
            }

            .footer {
                border-top-color: #4a5568;
            }

            .footer p {
                color: #718096;
            }

            .menu-icon.add {
                background: rgba(102, 126, 234, 0.2);
                color: #8896f5;
            }

            .menu-icon.check {
                background: rgba(72, 187, 120, 0.2);
                color: #68d391;
            }

            .menu-icon.list {
                background: rgba(237, 137, 54, 0.2);
                color: #f6ad55;
            }

            .menu-card.add:hover .menu-icon {
                background: #667eea;
                color: white;
            }

            .menu-card.check:hover .menu-icon {
                background: #48bb78;
                color: white;
            }

            .menu-card.list:hover .menu-icon {
                background: #ed8936;
                color: white;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">
                    <i class="fas fa-box-open"></i>
                </div>
                <h1>Expiry<span>Manager</span></h1>
            </div>
            <div class="header-badge">
                <i class="fas fa-circle" style="color: #48bb78; font-size: 8px;"></i>
                Online
            </div>
        </div>

        <!-- STATS - TAMPILKAN 0 -->
        <div class="stats-card">
            <div class="stats-item">
                <span class="number">0</span>
                <span class="label">Total Produk</span>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
                <span class="number" style="color: #fbd38d;">0</span>
                <span class="label">Akan Kadaluarsa</span>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
                <span class="number" style="color: #fc8181;">0</span>
                <span class="label">Kadaluarsa</span>
            </div>
        </div>

        <!-- MENU -->
        <div class="menu-grid">
            <!-- Add Produk - LINK ke halaman tambah produk (master data) -->
            <a href="tes.html" class="menu-card add">
                <div class="menu-icon add">
                    <i class="fas fa-plus-circle"></i>
                </div>
                <div class="menu-text">
                    <h3>Tambah Produk</h3>
                    <p><i class="fas fa-barcode"></i> Scan barcode & input data</p>
                </div>
                <div class="menu-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </a>

            <!-- Checker - tetap dengan fungsi toast -->
            <div class="menu-card check" onclick="showToast('📋 Cek produk kadaluarsa', 'info')">
                <div class="menu-icon check">
                    <i class="fas fa-search"></i>
                </div>
                <div class="menu-text">
                    <h3>Cek Kadaluarsa</h3>
                    <p><i class="fas fa-clipboard-check"></i> Cek produk yang expired</p>
                </div>
                <div class="menu-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>

            <!-- Master List - LINK ke halaman daftar produk (master data) -->
            <a href="master.html" class="menu-card list">
                <div class="menu-icon list">
                    <i class="fas fa-list-ul"></i>
                </div>
                <div class="menu-text">
                    <h3>Daftar Produk</h3>
                    <p><i class="fas fa-table"></i> Lihat semua produk tersimpan</p>
                </div>
                <div class="menu-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </a>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>
                <i class="fas fa-database"></i>
                Data tersimpan di lokal
                <span class="dot"></span>
                <span class="status-online">
                    <i class="fas fa-circle"></i> Online
                </span>
            </p>
        </div>

    </div>

    <script>
        // ============================================================
        //  TOAST NOTIFICATION
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) {
                existing.classList.add('hidden');
                setTimeout(() => existing.remove(), 400);
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️'
            };
            
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('hidden');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        console.log('✅ Expiry Manager siap digunakan!');
        console.log('📌 Menu "Tambah Produk" → tambah-produk.html');
        console.log('📌 Menu "Daftar Produk" → daftar-produk.html');
    </script>
</body>
</html>
