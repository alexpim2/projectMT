<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Data Product</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 15px; max-width: 450px; margin: auto; background: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #28a745; font-size: 20px; }
    label { font-size: 13px; font-weight: bold; margin-top: 12px; display: block; }
    input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; margin-top: 18px; background: #007bff; color: white; border: none; font-weight: bold; font-size: 15px; border-radius: 6px; cursor: pointer; }
    #reader { width: 100%; margin-bottom: 15px; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📦 Master Data & Add Product</h2>
    
    <!-- Camera Area -->
    <div id="reader"></div>

    <form id="masterForm">
      <label>PLU / Barcode Kode:</label>
      <input type="text" id="plu" placeholder="Scan atau ketik PLU baru..." required>

      <label>Nama Barang Baru:</label>
      <input type="text" id="namaBarang" placeholder="Contoh: Indomie Goreng 85g" required>

      <label>Stok Awal / Qty (Opsional - ke sheet mentahan):</label>
      <input type="number" id="qty" value="0" min="0">

      <label>Tanggal Expired (Opsional):</label>
      <input type="date" id="exp">

      <button type="submit" id="btnSubmit">TAMBAH MASTER BARANG</button>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "PASTE_URL_WEB_APP_APPS_SCRIPT_KAMU_DI_SINI";

    // Camera Barcode Scanner
    function onScanSuccess(decodedText) {
      document.getElementById('plu').value = decodedText;
    }
    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
    html5QrcodeScanner.render(onScanSuccess);

    // Submit Master Data Baru
    document.getElementById('masterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const payload = {
        action: "addMaster",
        plu: document.getElementById('plu').value,
        namaBarang: document.getElementById('namaBarang').value,
        qty: document.getElementById('qty').value,
        exp: document.getElementById('exp').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        if (data.status === "success") {
          document.getElementById('masterForm').reset();
        }
      })
      .catch(err => alert("Gagal menyimpan: " + err))
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "TAMBAH MASTER BARANG";
      });
    });
  </script>
</body>
</html>
