<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Product - Expiry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8, #dce3ed);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .back-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .back-btn {
            background: rgba(255,255,255,0.6);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #1f2b44;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.8);
            cursor: pointer;
        }
        .back-btn:active {
            transform: scale(0.92);
        }
        .back-header h2 {
            font-size: 22px;
            color: #1a2639;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3a5e;
            font-size: 14px;
        }
        label i {
            margin-right: 8px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d0d9e8;
            border-radius: 16px;
            font-size: 16px;
            background: white;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3a5a9a;
            box-shadow: 0 0 0 3px rgba(58, 90, 154, 0.1);
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
        }
        .scan-btn {
            background: linear-gradient(135deg, #2d3a6a, #1f2b44);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scan-btn:active {
            transform: scale(0.95);
        }
        .scan-btn i {
            font-size: 18px;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #2a7a4a, #1a5a3a);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-danger {
            background: linear-gradient(135deg, #b33a3a, #8a2a2a);
            margin-top: 4px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #4a6a8a, #2d4a6a);
            margin-top: 4px;
        }
        .btn-sync {
            background: linear-gradient(135deg, #1a5a7a, #0a3a5a);
            margin-top: 4px;
        }
        .preview-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .preview-item {
            background: white;
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e8edf5;
            font-size: 14px;
        }
        .preview-item .info {
            flex: 1;
        }
        .preview-item .name {
            font-weight: 600;
            color: #1a2639;
        }
        .preview-item .detail {
            font-size: 12px;
            color: #5a6a8a;
        }
        .preview-item .delete-btn {
            color: #b33a3a;
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,30,50,0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 15px;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            transition: opacity 0.4s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.success {
            border-color: #2a7a4a;
        }
        .toast.error {
            border-color: #b33a3a;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-ok {
            background: #d4edda;
            color: #155724;
        }
        .badge-exp {
            background: #f8d7da;
            color: #721c24;
        }
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        .sync-status {
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 14px;
            background: #eef2f7;
            font-size: 13px;
            color: #2d3a5e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sync-status .synced {
            color: #2a7a4a;
            font-weight: 600;
        }
        .sync-status .unsynced {
            color: #b33a3a;
            font-weight: 600;
        }
        .sync-status .syncing {
            color: #856404;
            font-weight: 600;
        }

        /* ===== SCANNER OVERLAY ===== */
        .scanner-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .scanner-overlay.active {
            display: flex;
        }
        .scanner-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
        }
        #scanner-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        #scanner-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 10;
        }
        .scanner-close:active {
            transform: scale(0.9);
            background: rgba(255,0,0,0.3);
        }
        .scanner-hint {
            color: white;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.8;
        }
        .scanner-hint i {
            margin-right: 8px;
        }
        .scanning-line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            animation: scanLine 2s infinite;
            box-shadow: 0 0 20px #00ff88;
        }
        @keyframes scanLine {
            0% { top: 10%; }
            50% { top: 85%; }
            100% { top: 10%; }
        }
        .scan-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #00ff88;
            filter: drop-shadow(0 0 10px #00ff88);
        }
        .scan-corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .scan-corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .scan-corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .scan-corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        @media (max-width: 400px) {
            .container { padding: 16px; }
            .scan-btn { padding: 12px 14px; font-size: 14px; }
            input { padding: 12px 14px; font-size: 15px; }
            .scan-corner { width: 20px; height: 20px; border-width: 3px; }
            .scan-corner.tl { top: 15px; left: 15px; }
            .scan-corner.tr { top: 15px; right: 15px; }
            .scan-corner.bl { bottom: 15px; left: 15px; }
            .scan-corner.br { bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2><i class="fas fa-barcode"></i> Add Produk</h2>
        </div>

        <div class="form-group">
            <label><i class="fas fa-barcode"></i> EAN / Barcode</label>
            <div class="input-group">
                <input type="text" id="eanInput" placeholder="Scan atau ketik EAN" />
                <button class="scan-btn" onclick="openScanner()">
                    <i class="fas fa-camera"></i> Scan
                </button>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-box"></i> Nama Produk</label>
            <input type="text" id="nameInput" placeholder="Nama produk" />
        </div>

        <div class="form-group">
            <label><i class="fas fa-tag"></i> Brand / Merek</label>
            <input type="text" id="brandInput" placeholder="Merek produk (opsional)" />
        </div>

        <div class="form-group">
            <label><i class="fas fa-sort-amount-up"></i> Quantity</label>
            <input type="number" id="qtyInput" placeholder="Jumlah" min="1" value="1" />
        </div>

        <div class="form-group">
            <label><i class="fas fa-calendar-alt"></i> Tanggal Kadaluarsa</label>
            <input type="date" id="expInput" />
        </div>

        <button class="btn-primary" onclick="addProduct()">
            <i class="fas fa-plus-circle"></i> Tambahkan Produk
        </button>

        <button class="btn-primary btn-sync" onclick="syncToGitHub()">
            <i class="fas fa-cloud-upload-alt"></i> Sync ke GitHub (Excel)
        </button>

        <button class="btn-primary btn-secondary" onclick="autoFillDemo()">
            <i class="fas fa-magic"></i> Demo Auto-Fill
        </button>

        <button class="btn-primary btn-danger" onclick="clearAllData()">
            <i class="fas fa-trash"></i> Hapus Semua Data
        </button>

        <div class="sync-status" id="syncStatus">
            <span><i class="fas fa-cloud-upload-alt"></i> GitHub Sync</span>
            <span id="syncStatusText" class="unsynced">⏳ Belum sync</span>
            <button onclick="syncToGitHub()" style="background:#1a5a7a;color:white;border:none;padding:6px 14px;border-radius:12px;font-weight:600;cursor:pointer;">
                <i class="fas fa-sync"></i> Sync
            </button>
        </div>

        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
            <h4 style="color:#1a2639;"><i class="fas fa-list"></i> Preview</h4>
            <span id="previewCount" style="font-size:13px; color:#5a6a8a;">0 produk</span>
        </div>
        <div id="previewList" class="preview-list"></div>
    </div>

    <!-- ===== SCANNER OVERLAY ===== -->
    <div class="scanner-overlay" id="scannerOverlay">
        <div class="scanner-container">
            <div id="scanner-box">
                <div class="scan-corner tl"></div>
                <div class="scan-corner tr"></div>
                <div class="scan-corner bl"></div>
                <div class="scan-corner br"></div>
                <div class="scanning-line"></div>
                <button class="scanner-close" onclick="closeScanner()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="scanner-hint">
                <i class="fas fa-camera"></i> Arahkan kamera ke barcode produk
            </div>
        </div>
    </div>

    <!-- ===== LIBRARY ===== -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        // ============================================================
        //  VARIABLES
        // ============================================================
        let html5QrCode = null;
        let isSyncing = false;
        const GITHUB_API_URL = 'https://api.github.com/repos/alexpim2/projectMT/contents/masterlist.xlsx';

        // ============================================================
        //  DATA (JSON di browser)
        // ============================================================
        function getProducts() {
            try {
                return JSON.parse(localStorage.getItem('products')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveProducts(products) {
            try {
                localStorage.setItem('products', JSON.stringify(products));
            } catch (e) {
                console.error('Save error:', e);
            }
        }

        // ============================================================
        //  SET DEFAULT DATE
        // ============================================================
        function setDefaultDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('expInput').value = `${year}-${month}-${day}`;
        }

        // ============================================================
        //  SCANNER
        // ============================================================
        function openScanner() {
            const overlay = document.getElementById('scannerOverlay');
            overlay.classList.add('active');
            
            if (html5QrCode) {
                html5QrCode.clear();
                html5QrCode = null;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('⚠️ Browser tidak support kamera', 'error');
                overlay.classList.remove('active');
                return;
            }

            html5QrCode = new Html5Qrcode("scanner-box");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 30, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                onScanError
            ).catch(err => {
                showToast('⚠️ Gagal akses kamera', 'error');
                overlay.classList.remove('active');
            });
        }

        function onScanSuccess(decodedText) {
            document.getElementById('eanInput').value = decodedText;
            
            const products = getProducts();
            const existing = products.find(p => p.ean === decodedText);
            if (existing) {
                document.getElementById('nameInput').value = existing.name;
                document.getElementById('brandInput').value = existing.brand || '';
                showToast(`✅ Ditemukan: ${existing.name}`, 'success');
            } else {
                showToast('🔍 EAN baru, silakan isi nama', 'info');
            }
            
            setTimeout(() => closeScanner(), 500);
        }

        function onScanError(err) {}

        function closeScanner() {
            const overlay = document.getElementById('scannerOverlay');
            overlay.classList.remove('active');
            
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                }).catch(err => console.error('Stop scanner error:', err));
            }
        }

        // ============================================================
        //  AUTO FILL DEMO
        // ============================================================
        function autoFillDemo() {
            const data = [
                { ean: '8991001234567', name: 'Susu Ultra Full Cream 1L', brand: 'Ultra' },
                { ean: '8992002345678', name: 'Kecap Manis ABC 600ml', brand: 'ABC' },
                { ean: '8993003456789', name: 'Mie Instan Goreng 80g', brand: 'Indomie' }
            ];
            
            const random = data[Math.floor(Math.random() * data.length)];
            document.getElementById('eanInput').value = random.ean;
            document.getElementById('nameInput').value = random.name;
            document.getElementById('brandInput').value = random.brand;
            showToast(`📦 Demo: ${random.name}`, 'info');
        }

        // ============================================================
        //  ADD PRODUCT (JSON di LocalStorage)
        // ============================================================
        function addProduct() {
            const ean = document.getElementById('eanInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const brand = document.getElementById('brandInput').value.trim();
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            const exp = document.getElementById('expInput').value;

            if (!ean || !name || !exp) {
                showToast('⚠️ Mohon isi semua data!', 'error');
                return;
            }

            let products = getProducts();
            
            const existing = products.find(p => p.ean === ean);
            if (existing) {
                if (!confirm(`⚠️ "${existing.name}" sudah ada. Update quantity?`)) return;
                existing.qty += qty;
                existing.exp = exp;
                if (brand) existing.brand = brand;
                showToast(`✅ Updated ${existing.name} (+${qty})`, 'success');
            } else {
                products.push({ ean, name, brand, qty, exp });
                showToast(`✅ ${name} ditambahkan!`, 'success');
            }

            saveProducts(products);
            renderPreview();
            clearForm();
            setDefaultDate();
            
            document.getElementById('syncStatusText').className = 'unsynced';
            document.getElementById('syncStatusText').textContent = '⏳ Belum sync';
        }

        // ============================================================
        //  DELETE & CLEAR
        // ============================================================
        function deleteProduct(index) {
            if (!confirm('Hapus produk ini?')) return;
            let products = getProducts();
            products.splice(index, 1);
            saveProducts(products);
            renderPreview();
            showToast('🗑️ Produk dihapus', 'info');
        }

        function clearAllData() {
            if (!confirm('⚠️ Hapus SEMUA data?')) return;
            localStorage.removeItem('products');
            localStorage.removeItem('lastSync');
            renderPreview();
            showToast('🗑️ Semua data dihapus', 'info');
        }

        // ============================================================
        //  SYNC KE GITHUB -> TETAP EXCEL (.xlsx)
        //  Data di browser JSON, tapi di GitHub tetep Excel
        // ============================================================
        async function syncToGitHub() {
            if (isSyncing) {
                showToast('⏳ Sync sedang berjalan...', 'info');
                return;
            }
            
            const products = getProducts();
            if (products.length === 0) {
                showToast('⚠️ Tidak ada data untuk disync', 'error');
                return;
            }

            const statusText = document.getElementById('syncStatusText');
            isSyncing = true;
            statusText.className = 'syncing';
            statusText.textContent = '⏳ Syncing...';
            
            try {
                // 1. Buat data Excel dari JSON
                const excelData = products.map((p, i) => ({
                    'No': i + 1,
                    'EAN': p.ean || '',
                    'Long Description': p.name || '',
                    'Brand': p.brand || '',
                    'Qty': p.qty || 0,
                    'Tanggal Exp': p.exp || '',
                    'Status': new Date(p.exp) < new Date() ? 'Expired' : 'Active'
                }));

                // 2. Buat workbook Excel
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(excelData);
                ws['!cols'] = [
                    { wch: 6 }, { wch: 18 }, { wch: 30 }, 
                    { wch: 15 }, { wch: 8 }, { wch: 20 }, { wch: 12 }
                ];
                XLSX.utils.book_append_sheet(wb, ws, 'MasterList');

                // 3. Convert ke base64
                const buffer = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
                const base64 = btoa(String.fromCharCode(...new Uint8Array(buffer)));

                // 4. Cek SHA file
                let sha = null;
                try {
                    const res = await fetch(GITHUB_API_URL);
                    if (res.ok) {
                        const data = await res.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                // 5. Upload ke GitHub (tetap .xlsx)
                const uploadRes = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Update masterlist ${new Date().toLocaleString('id-ID')}`,
                        content: base64,
                        sha: sha || undefined,
                        branch: 'main'
                    })
                });

                if (!uploadRes.ok) {
                    const err = await uploadRes.json();
                    throw new Error(err.message || `HTTP ${uploadRes.status}`);
                }

                localStorage.setItem('lastSync', Date.now().toString());
                statusText.className = 'synced';
                statusText.textContent = `✅ ${new Date().toLocaleTimeString('id-ID')}`;
                showToast('✅ Data berhasil disync ke GitHub (Excel)!', 'success');

            } catch (error) {
                console.error('Sync error:', error);
                statusText.className = 'unsynced';
                statusText.textContent = `❌ ${error.message || 'Gagal'}`;
                showToast(`❌ Gagal sync: ${error.message}`, 'error');
            } finally {
                isSyncing = false;
            }
        }

        // ============================================================
        //  RENDER PREVIEW
        // ============================================================
        function renderPreview() {
            const products = getProducts();
            const list = document.getElementById('previewList');
            const count = document.getElementById('previewCount');
            
            if (products.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:#7a8aaa;padding:20px;">Belum ada produk</p>';
                count.textContent = '0 produk';
                return;
            }

            list.innerHTML = products.map((p, i) => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const expDate = new Date(p.exp);
                expDate.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                
                let statusClass = 'badge-ok';
                let statusText = '✅ OK';
                if (diffDays < 0) { statusClass = 'badge-exp'; statusText = '❌ Expired'; }
                else if (diffDays <= 3) { statusClass = 'badge-warning'; statusText = '⚠️ Segera'; }
                
                return `
                    <div class="preview-item">
                        <div class="info">
                            <div class="name">${p.name} ${p.brand ? `(${p.brand})` : ''}</div>
                            <div class="detail">
                                EAN: ${p.ean} | Qty: ${p.qty} | Exp: ${p.exp} (${diffDays} hari)
                                <span class="badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <span class="delete-btn" onclick="deleteProduct(${i})">✕</span>
                    </div>
                `;
            }).join('');

            count.textContent = `${products.length} produk`;
            updateSyncStatus();
        }

        // ============================================================
        //  UPDATE SYNC STATUS
        // ============================================================
        function updateSyncStatus() {
            const statusText = document.getElementById('syncStatusText');
            const lastSync = localStorage.getItem('lastSync');
            if (lastSync) {
                statusText.className = 'synced';
                statusText.textContent = `✅ ${new Date(parseInt(lastSync)).toLocaleTimeString('id-ID')}`;
            } else {
                statusText.className = 'unsynced';
                statusText.textContent = '⏳ Belum sync';
            }
        }

        // ============================================================
        //  CLEAR FORM
        // ============================================================
        function clearForm() {
            document.getElementById('eanInput').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('brandInput').value = '';
            document.getElementById('qtyInput').value = '1';
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // ============================================================
        //  INIT
        // ============================================================
        setDefaultDate();
        renderPreview();
        updateSyncStatus();

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeScanner();
        });

        document.getElementById('scannerOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeScanner();
        });
    </script>
</body>
</html>
