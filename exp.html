<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Product - Expiry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8, #dce3ed);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .back-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .back-btn {
            background: rgba(255,255,255,0.6);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #1f2b44;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.8);
            cursor: pointer;
        }
        .back-btn:active {
            transform: scale(0.92);
        }
        .back-header h2 {
            font-size: 22px;
            color: #1a2639;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3a5e;
            font-size: 14px;
        }
        label i {
            margin-right: 8px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d0d9e8;
            border-radius: 16px;
            font-size: 16px;
            background: white;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3a5a9a;
            box-shadow: 0 0 0 3px rgba(58, 90, 154, 0.1);
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
        }
        .scan-btn {
            background: linear-gradient(135deg, #2d3a6a, #1f2b44);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scan-btn:active {
            transform: scale(0.95);
        }
        .scan-btn i {
            font-size: 18px;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #2a7a4a, #1a5a3a);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-danger {
            background: linear-gradient(135deg, #b33a3a, #8a2a2a);
            margin-top: 4px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #4a6a8a, #2d4a6a);
            margin-top: 4px;
        }
        .preview-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .preview-item {
            background: white;
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e8edf5;
            font-size: 14px;
        }
        .preview-item .info {
            flex: 1;
        }
        .preview-item .name {
            font-weight: 600;
            color: #1a2639;
        }
        .preview-item .detail {
            font-size: 12px;
            color: #5a6a8a;
        }
        .preview-item .delete-btn {
            color: #b33a3a;
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,30,50,0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 15px;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            transition: opacity 0.4s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-ok {
            background: #d4edda;
            color: #155724;
        }
        .badge-exp {
            background: #f8d7da;
            color: #721c24;
        }
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        /* ===== SCANNER OVERLAY ===== */
        .scanner-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .scanner-overlay.active {
            display: flex;
        }
        .scanner-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
        }
        #scanner-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        #scanner-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 10;
        }
        .scanner-close:active {
            transform: scale(0.9);
            background: rgba(255,0,0,0.3);
        }
        .scanner-hint {
            color: white;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.8;
        }
        .scanner-hint i {
            margin-right: 8px;
        }
        .scanning-line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            animation: scanLine 2s infinite;
            box-shadow: 0 0 20px #00ff88;
        }
        @keyframes scanLine {
            0% { top: 10%; }
            50% { top: 85%; }
            100% { top: 10%; }
        }
        .scan-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #00ff88;
            filter: drop-shadow(0 0 10px #00ff88);
        }
        .scan-corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .scan-corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .scan-corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .scan-corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        @media (max-width: 400px) {
            .container { padding: 16px; }
            .scan-btn { padding: 12px 14px; font-size: 14px; }
            input { padding: 12px 14px; font-size: 15px; }
            .scan-corner { width: 20px; height: 20px; border-width: 3px; }
            .scan-corner.tl { top: 15px; left: 15px; }
            .scan-corner.tr { top: 15px; right: 15px; }
            .scan-corner.bl { bottom: 15px; left: 15px; }
            .scan-corner.br { bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="back-header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2><i class="fas fa-barcode"></i> Add Produk</h2>
        </div>

        <!-- Form -->
        <div class="form-group">
            <label><i class="fas fa-barcode"></i> EAN / Barcode</label>
            <div class="input-group">
                <input type="text" id="eanInput" placeholder="Scan atau ketik EAN" />
                <button class="scan-btn" onclick="openScanner()">
                    <i class="fas fa-camera"></i> Scan
                </button>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-box"></i> Nama Produk</label>
            <input type="text" id="nameInput" placeholder="Nama produk" />
        </div>

        <div class="form-group">
            <label><i class="fas fa-sort-amount-up"></i> Quantity</label>
            <input type="number" id="qtyInput" placeholder="Jumlah" min="1" value="1" />
        </div>

        <div class="form-group">
            <label><i class="fas fa-calendar-alt"></i> Tanggal Kadaluarsa</label>
            <input type="date" id="expInput" />
        </div>

        <button class="btn-primary" onclick="addProduct()">
            <i class="fas fa-plus-circle"></i> Tambahkan Produk
        </button>

        <button class="btn-primary btn-secondary" onclick="autoFillDemo()">
            <i class="fas fa-magic"></i> Demo Auto-Fill
        </button>

        <button class="btn-primary btn-danger" onclick="clearAllData()">
            <i class="fas fa-trash"></i> Hapus Semua Data
        </button>

        <!-- Preview -->
        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
            <h4 style="color:#1a2639;"><i class="fas fa-list"></i> Preview</h4>
            <span id="previewCount" style="font-size:13px; color:#5a6a8a;">0 produk</span>
        </div>
        <div id="previewList" class="preview-list"></div>
    </div>

    <!-- ===== SCANNER OVERLAY ===== -->
    <div class="scanner-overlay" id="scannerOverlay">
        <div class="scanner-container">
            <div id="scanner-box">
                <!-- Scanner akan di-render di sini -->
                <div class="scan-corner tl"></div>
                <div class="scan-corner tr"></div>
                <div class="scan-corner bl"></div>
                <div class="scan-corner br"></div>
                <div class="scanning-line"></div>
                <button class="scanner-close" onclick="closeScanner()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="scanner-hint">
                <i class="fas fa-camera"></i> Arahkan kamera ke barcode produk
            </div>
        </div>
    </div>

    <!-- ===== LIBRARY SCANNER ===== -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script>
        // ===== VARIABLES =====
        let html5QrCode = null;
        let isScanning = false;

        // ===== DATA =====
        function getProducts() {
            return JSON.parse(localStorage.getItem('products')) || [];
        }

        function saveProducts(products) {
            localStorage.setItem('products', JSON.stringify(products));
        }

        // ===== SET DEFAULT DATE = HARI INI =====
        function setDefaultDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateString = `${year}-${month}-${day}`;
            document.getElementById('expInput').value = dateString;
        }

        // ===== OPEN SCANNER =====
        function openScanner() {
            const overlay = document.getElementById('scannerOverlay');
            overlay.classList.add('active');
            
            // Cek apakah sudah ada instance
            if (html5QrCode) {
                html5QrCode.clear();
                html5QrCode = null;
            }

            // Cek support camera
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('⚠️ Browser tidak support kamera');
                overlay.classList.remove('active');
                return;
            }

            const scannerBox = document.getElementById('scanner-box');
            
            html5QrCode = new Html5Qrcode("scanner-box");

            const config = {
                fps: 30,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).catch(err => {
                console.error('Scanner error:', err);
                showToast('⚠️ Gagal akses kamera. Coba izinkan akses kamera.');
                overlay.classList.remove('active');
            });
        }

        // ===== SCAN SUCCESS =====
        function onScanSuccess(decodedText, decodedResult) {
            // decodedText = hasil scan barcode (EAN)
            console.log('Scan result:', decodedText);
            
            // Isi ke input EAN
            document.getElementById('eanInput').value = decodedText;
            
            // Coba cari produk berdasarkan EAN (untuk auto-fill nama)
            const products = getProducts();
            const existing = products.find(p => p.ean === decodedText);
            if (existing) {
                document.getElementById('nameInput').value = existing.name;
                showToast(`✅ Ditemukan: ${existing.name}`);
            } else {
                // Auto-fill nama dummy (bisa diganti dengan API produk)
                const dummyNames = [
                    'Susu Ultra', 'Kecap ABC', 'Mie Instan', 'Kopi Hitam',
                    'Minyak Goreng', 'Gula Pasir', 'Roti Tawar', 'Saus Tomat',
                    'Telur Ayam', 'Beras Premium', 'Minyak Zaitun', 'Madu Murni'
                ];
                const randomName = dummyNames[Math.floor(Math.random() * dummyNames.length)];
                document.getElementById('nameInput').value = randomName;
                showToast(`📦 Scan: ${randomName} (${decodedText})`);
            }
            
            // Tutup scanner setelah berhasil scan
            setTimeout(() => {
                closeScanner();
            }, 500);
        }

        // ===== SCAN ERROR =====
        function onScanError(err) {
            // Ignore error (terus scanning)
            // console.warn('Scan error:', err);
        }

        // ===== CLOSE SCANNER =====
        function closeScanner() {
            const overlay = document.getElementById('scannerOverlay');
            overlay.classList.remove('active');
            
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                }).catch(err => {
                    console.error('Stop scanner error:', err);
                });
            }
            isScanning = false;
        }

        // ===== AUTO FILL DEMO (untuk testing tanpa kamera) =====
        function autoFillDemo() {
            const data = [
                { ean: '8991001234567', name: 'Susu Ultra' },
                { ean: '8992002345678', name: 'Kecap ABC' },
                { ean: '8993003456789', name: 'Mie Instan' },
                { ean: '8994004567890', name: 'Kopi Hitam' },
                { ean: '8995005678901', name: 'Minyak Goreng' },
                { ean: '8996006789012', name: 'Gula Pasir' }
            ];
            
            const random = data[Math.floor(Math.random() * data.length)];
            document.getElementById('eanInput').value = random.ean;
            document.getElementById('nameInput').value = random.name;
            
            showToast(`📦 Demo: ${random.name}`);
        }

        // ===== ADD PRODUCT =====
        function addProduct() {
            const ean = document.getElementById('eanInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            const exp = document.getElementById('expInput').value;

            if (!ean || !name || !exp) {
                showToast('⚠️ Mohon isi semua data!');
                return;
            }

            // Validasi tanggal
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expDate = new Date(exp);
            expDate.setHours(0, 0, 0, 0);
            
            if (expDate < today) {
                if (!confirm('⚠️ Tanggal kadaluarsa sudah lewat! Lanjutkan?')) {
                    return;
                }
            }

            let products = getProducts();
            
            // Cek duplikat
            const existing = products.find(p => p.ean === ean);
            if (existing) {
                if (!confirm(`⚠️ "${existing.name}" sudah ada. Update quantity?`)) return;
                existing.qty += qty;
                existing.exp = exp;
                showToast(`✅ Updated ${existing.name} (+${qty})`);
            } else {
                products.push({ ean, name, qty, exp });
                showToast(`✅ ${name} ditambahkan!`);
            }

            saveProducts(products);
            renderPreview();
            clearForm();
            setDefaultDate();
        }

        // ===== DELETE PRODUCT =====
        function deleteProduct(index) {
            if (!confirm('Hapus produk ini?')) return;
            let products = getProducts();
            products.splice(index, 1);
            saveProducts(products);
            renderPreview();
            showToast('🗑️ Produk dihapus');
        }

        // ===== CLEAR ALL =====
        function clearAllData() {
            if (!confirm('⚠️ Hapus SEMUA data? Ini tidak bisa dibatalkan!')) return;
            localStorage.removeItem('products');
            renderPreview();
            showToast('🗑️ Semua data dihapus');
        }

        // ===== RENDER PREVIEW =====
        function renderPreview() {
            const products = getProducts();
            const list = document.getElementById('previewList');
            const count = document.getElementById('previewCount');
            
            if (products.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:#7a8aaa;padding:20px;">Belum ada produk</p>';
                count.textContent = '0 produk';
                return;
            }

            list.innerHTML = products.map((p, i) => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const expDate = new Date(p.exp);
                expDate.setHours(0, 0, 0, 0);
                
                const diffTime = expDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let statusClass = 'badge-ok';
                let statusText = '✅ OK';
                
                if (diffDays < 0) {
                    statusClass = 'badge-exp';
                    statusText = '❌ Expired';
                } else if (diffDays <= 3) {
                    statusClass = 'badge-warning';
                    statusText = '⚠️ Segera';
                }
                
                return `
                    <div class="preview-item">
                        <div class="info">
                            <div class="name">${p.name}</div>
                            <div class="detail">
                                EAN: ${p.ean} | Qty: ${p.qty} | Exp: ${p.exp} (${diffDays} hari)
                                <span class="badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <span class="delete-btn" onclick="deleteProduct(${i})">✕</span>
                    </div>
                `;
            }).join('');

            count.textContent = `${products.length} produk`;
        }

        // ===== CLEAR FORM =====
        function clearForm() {
            document.getElementById('eanInput').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('qtyInput').value = '1';
        }

        // ===== TOAST =====
        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 2500);
        }

        // ===== INIT =====
        setDefaultDate();
        renderPreview();

        // Close scanner dengan tombol ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeScanner();
            }
        });

        // Close scanner jika klik di luar area scanner
        document.getElementById('scannerOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeScanner();
            }
        });
    </script>
</body>
</html>
