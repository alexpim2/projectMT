<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Expiry Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8, #dce3ed);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .home-container {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 28px 22px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 650;
            background: linear-gradient(135deg, #1a2639, #2b3b5c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-icon {
            background: rgba(255,255,255,0.6);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #1f2b44;
            border: 1px solid rgba(255,255,255,0.8);
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 16px;
        }
        .menu-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 22px 24px;
            border: 1px solid rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }
        .menu-card:active {
            transform: scale(0.97);
            background: rgba(255,255,255,0.8);
        }
        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }
        .card-icon.add {
            background: linear-gradient(135deg, #d1e0ff, #b6cdfa);
            color: #1f3a7a;
        }
        .card-icon.check {
            background: linear-gradient(135deg, #d4f0e0, #b5e0cc);
            color: #0f4a3a;
        }
        .card-icon.list {
            background: linear-gradient(135deg, #fae2d0, #f5d0b8);
            color: #7a4a2a;
        }
        .card-content {
            flex: 1;
        }
        .card-content h3 {
            font-size: 20px;
            font-weight: 620;
            color: #131d33;
        }
        .card-content p {
            font-size: 14px;
            color: #3f4b64;
            opacity: 0.8;
        }
        .badge-arrow {
            background: rgba(255,255,255,0.3);
            width: 36px;
            height: 36px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2f3d5e;
            font-size: 16px;
        }
        .status-badge {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.3);
            padding: 14px 20px;
            border-radius: 40px;
            margin: 20px 0 10px;
            border: 1px solid rgba(255,255,255,0.5);
            font-size: 14px;
            color: #1d2a44;
            font-weight: 500;
        }
        .status-badge .count {
            background: #1f2b44;
            color: white;
            padding: 2px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
        }
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #4d5a77;
            opacity: 0.6;
        }
        @media (max-width: 400px) {
            .home-container { padding: 20px 16px; }
            .menu-card { padding: 18px 18px; gap: 12px; }
            .card-icon { width: 50px; height: 50px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="app-header">
            <h1><i class="fas fa-box-open"></i> Expiry</h1>
            <div class="header-icon"><i class="fas fa-calendar-alt"></i></div>
        </div>

        <div class="menu-grid">
            <!-- ADD PRODUK EXP → href ke exp.html -->
            <a href="exp.html" class="menu-card">
                <div class="card-icon add"><i class="fas fa-plus-circle"></i></div>
                <div class="card-content">
                    <h3>Add Produk Exp</h3>
                    <p><i class="fas fa-barcode"></i> Scan EAN, Qty, Exp</p>
                </div>
                <div class="badge-arrow"><i class="fas fa-chevron-right"></i></div>
            </a>

            <!-- CHECKER -->
            <div class="menu-card" onclick="checkExpired()">
                <div class="card-icon check"><i class="fas fa-search"></i></div>
                <div class="card-content">
                    <h3>Checker</h3>
                    <p><i class="fas fa-clipboard-list"></i> Cek status expired</p>
                </div>
                <div class="badge-arrow"><i class="fas fa-chevron-right"></i></div>
            </div>

            <!-- MASTER LIST -->
            <div class="menu-card" onclick="showMasterList()">
                <div class="card-icon list"><i class="fas fa-archive"></i></div>
                <div class="card-content">
                    <h3>Master List Exp</h3>
                    <p><i class="fas fa-database"></i> Semua produk & kadaluarsa</p>
                </div>
                <div class="badge-arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
        </div>

        <div class="status-badge">
            <span><i class="fas fa-hourglass-half"></i> <span id="expiringCount">0</span> produk akan kadaluarsa</span>
            <span class="count" id="totalCount">0</span>
        </div>

        <div class="footer-note">
            <span><i class="far fa-clock"></i> <span id="lastUpdate">Belum sync</span></span>
        </div>
    </div>

    <script>
        // ===== LOAD DATA =====
        function loadStats() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const today = new Date();
            const expiring = products.filter(p => {
                const exp = new Date(p.exp);
                const diff = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
                return diff >= 0 && diff <= 7;
            });
            
            document.getElementById('totalCount').textContent = products.length;
            document.getElementById('expiringCount').textContent = expiring.length;
            
            const lastSync = localStorage.getItem('lastSync');
            if (lastSync) {
                document.getElementById('lastUpdate').textContent = 
                    `Sync ${new Date(parseInt(lastSync)).toLocaleTimeString()}`;
            }
        }

        function checkExpired() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const expired = products.filter(p => new Date(p.exp) < new Date());
            if (expired.length === 0) {
                alert('✅ Semua produk masih segar!');
            } else {
                alert(`⚠️ ${expired.length} produk kadaluarsa:\n${expired.map(p => `${p.name} (${p.exp})`).join('\n')}`);
            }
        }

        function showMasterList() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            if (products.length === 0) {
                alert('📋 Belum ada produk terdaftar');
                return;
            }
            let msg = '📋 MASTER LIST EXP\n\n';
            products.forEach((p, i) => {
                const exp = new Date(p.exp);
                const today = new Date();
                const diff = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
                const status = diff < 0 ? '❌ EXPIRED' : diff <= 3 ? '⚠️ SEGERA' : '✅ OK';
                msg += `${i+1}. ${p.name} | ${p.exp} | ${status}\n`;
                msg += `   EAN: ${p.ean || '-'} | Qty: ${p.qty || 0}\n`;
            });
            alert(msg);
        }

        loadStats();
    </script>
</body>
</html>
